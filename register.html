<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plan&Go | Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<div class="glass-card animate-left">

  <!-- LEFT -->
  <div class="left">
    <h1 class="logo">PLAN<span>&</span>GO</h1>
    <p class="tagline">
      Your trusted partner for premium journeys,
      unforgettable memories, and seamless travel.
    </p>

    <div class="social-icons">
      <i class="fab fa-google"></i>
      <i class="fab fa-facebook-f"></i>
      <i class="fas fa-envelope"></i>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <h2>Create Account</h2>
    <p class="subtitle">Start your travel experience</p>

    <div class="input-box">
      <i class="fas fa-user"></i>
      <input type="text" id="regName" placeholder="Full name">
    </div>

    <div class="input-box">
      <i class="fas fa-envelope"></i>
      <input type="text" id="regIdentifier" placeholder="Email or Phone">
    </div>

    <div class="input-box">
      <i class="fas fa-lock"></i>
      <input type="password" id="regPassword" placeholder="Password">
      <i class="fas fa-eye toggle-eye"
         onclick="togglePassword('regPassword',this)"></i>
    </div>

    <div class="input-box">
      <i class="fas fa-lock"></i>
      <input type="password" id="regConfirm" placeholder="Confirm password">
      <i class="fas fa-eye toggle-eye"
         onclick="togglePassword('regConfirm',this)"></i>
    </div>

    <button class="btn-main w-100 mt-3" onclick="register()">REGISTER</button>

    <p class="switch-text">
      Already have an account?
      <a href="login.html">Sign in</a>
    </p>
  </div>

</div>

<script src="js/auth_v2.js"></script>
</body>
</html>
