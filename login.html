<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plan&Go | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<div class="glass-card animate-right">

  <!-- LEFT -->
  <div class="left">
    <h1 class="logo">PLAN<span>&</span>GO</h1>
    <p class="tagline">
      Discover the world’s most beautiful destinations with
      curated luxury travel experiences.
    </p>

    <div class="social-icons">
      <i class="fab fa-google"></i>
      <i class="fab fa-facebook-f"></i>
      <i class="fas fa-envelope"></i>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to continue your journey</p>

    <div class="input-box">
      <i class="fas fa-envelope"></i>
      <input type="text" id="loginIdentifier" placeholder="Email or Phone">
    </div>

    <div class="input-box">
      <i class="fas fa-lock"></i>
      <input type="password" id="loginPassword" placeholder="Password">
      <i class="fas fa-eye toggle-eye"
         onclick="togglePassword('loginPassword',this)"></i>
    </div>

    <button class="btn-main w-100 mt-3" onclick="login()">LOGIN</button>

    <p class="switch-text">
      Don’t have an account?
      <a href="register.html">Create one</a>
    </p>
  </div>

</div>

<script src="js/auth_v2.js"></script>
</body>
</html>
